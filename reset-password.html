<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose New Password — DL Transport Dispatch</title>
<link rel="stylesheet" href="loadboard.css?v=20260923-hover-crisp">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--slate-100,#f1f5f9); }
  .login-card { background:#fff; border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,.08); padding:36px 32px; width:100%; max-width:360px; }
  .login-card h1 { font-size:19px; margin:0 0 4px; }
  .login-card .subtext { margin-bottom:22px; line-height:1.45; }
  .login-card .field { margin-bottom:16px; }
  .login-card label { display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
  .login-card input { width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid var(--slate-500,#cbd5e1); border-radius:6px; font-size:14px; }
  .login-card .btn { width:100%; margin-top:6px; padding:10px; }
  .auth-message { color:#475569; font-size:13px; margin-top:12px; min-height:36px; line-height:1.45; }
  .auth-message.error { color:#b91c1c; }
  .auth-message.success { color:#166534; }
  .security-link { display:block; text-align:center; margin-top:14px; font-size:13px; color:#475569; }
  .hidden { display:none !important; }
</style>
</head>
<body>
  <main class="login-card">
    <section id="loading-state">
      <h1>Checking reset link</h1>
      <div class="subtext">Please wait while we verify your password-reset link.</div>
    </section>

    <section id="form-state" class="hidden">
      <h1>Choose a new password</h1>
      <div class="subtext">Use a password you do not use anywhere else.</div>

      <form id="reset-form">
        <div class="field">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input type="password" id="confirm-password" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit" class="btn" id="reset-submit">Save new password</button>
        <div id="reset-message" class="auth-message" role="status" aria-live="polite"></div>
      </form>
    </section>

    <section id="error-state" class="hidden">
      <h1>Reset link unavailable</h1>
      <div id="error-message" class="subtext">This password-reset link is invalid or has expired. Request a new one and try again.</div>
      <a class="security-link" href="forgot-password.html">Request another reset link</a>
    </section>

    <a id="login-link" class="security-link hidden" href="login.html">Back to sign in</a>
  </main>

  <script src="supabase.min.js"></script>
  <script>
    const SUPABASE_URL = "https://ygsapysqzwrpcimgvaqx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_8b8bSIiYm5TzLTw0WG1pAw_5ZWW5ZPL";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:"dl-dispatch-auth" },
    });

    const loadingState = document.getElementById("loading-state");
    const formState = document.getElementById("form-state");
    const errorState = document.getElementById("error-state");
    const errorMessage = document.getElementById("error-message");
    const loginLink = document.getElementById("login-link");
    const resetForm = document.getElementById("reset-form");
    const newPassword = document.getElementById("new-password");
    const confirmPassword = document.getElementById("confirm-password");
    const resetSubmit = document.getElementById("reset-submit");
    const resetMessage = document.getElementById("reset-message");
    let recoverySession = null;
    let recoveryEventReceived = false;

    function setResetMessage(text, type="") {
      resetMessage.textContent = text || "";
      resetMessage.className = `auth-message${type ? ` ${type}` : ""}`;
    }

    function showResetForm(session) {
      recoverySession = session;
      loadingState.classList.add("hidden");
      errorState.classList.add("hidden");
      formState.classList.remove("hidden");
      loginLink.classList.add("hidden");
      newPassword.focus();

      // Remove the one-time recovery token from the visible URL after Supabase has consumed it.
      const cleanUrl = new URL("reset-password.html", window.location.href).href;
      window.history.replaceState({}, document.title, cleanUrl);
    }

    function showError(text) {
      loadingState.classList.add("hidden");
      formState.classList.add("hidden");
      errorState.classList.remove("hidden");
      loginLink.classList.remove("hidden");
      if (text) errorMessage.textContent = text;
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        recoveryEventReceived = true;
        showResetForm(session);
      }
    });

    async function initializeRecovery() {
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const queryParams = new URLSearchParams(window.location.search);
      const authError = hashParams.get("error_description") || queryParams.get("error_description");
      if (authError) {
        showError("This password-reset link is invalid or has expired. Request a new one and try again.");
        return;
      }

      const { data, error } = await supabaseClient.auth.getSession();
      if (error) {
        console.error("Could not read password recovery session:", error);
        showError();
        return;
      }
      if (data?.session) {
        showResetForm(data.session);
        return;
      }

      // Give the recovery event a moment to arrive when the token was supplied in the URL hash.
      window.setTimeout(() => {
        if (!recoveryEventReceived && !recoverySession) showError();
      }, 1500);
    }

    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      setResetMessage("");

      if (!recoverySession) {
        showError();
        return;
      }
      if (newPassword.value.length < 8) {
        setResetMessage("Your new password must be at least 8 characters.", "error");
        return;
      }
      if (newPassword.value !== confirmPassword.value) {
        setResetMessage("The passwords do not match.", "error");
        return;
      }

      resetSubmit.disabled = true;
      resetSubmit.textContent = "Saving…";
      const { error } = await supabaseClient.auth.updateUser({ password: newPassword.value });

      if (error) {
        console.error("Password update failed:", error);
        setResetMessage("We could not update the password. Request a new reset link and try again.", "error");
        resetSubmit.disabled = false;
        resetSubmit.textContent = "Save new password";
        return;
      }

      newPassword.value = "";
      confirmPassword.value = "";
      resetSubmit.disabled = true;
      resetSubmit.textContent = "Password saved";
      setResetMessage("Your password has been updated. You can now sign in with the new password.", "success");
      await supabaseClient.auth.signOut();
      loginLink.classList.remove("hidden");
    });

    initializeRecovery();
  </script>
</body>
</html>
