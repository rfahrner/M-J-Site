<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volume</title>
  <link rel="stylesheet" href="loadboard.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <span>Dispatch</span>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>

  <div id="board-view">
    <div class="toolbar">
      <div class="toolbar-left">
        <h1 id="sheet-title" style="margin:0;">Volume</h1>
        <div class="subtext">See what volume looked like in previous weeks, months, or periods. Every number is computed live.</div>
      </div>
    </div>

    <div id="driver-sync-status" class="hidden"></div>

    <div class="location-tabs" id="vol-location-tabs" style="padding: 12px 20px 0;"></div>

    <div class="toolbar" style="padding: 10px 20px; border-bottom:none;">
      <div class="toolbar-left" style="gap:8px;">
        <button type="button" class="btn btn-ghost vol-range-btn" data-vol-range="period">Period</button>
        <button type="button" class="btn btn-ghost vol-range-btn" data-vol-range="month">Month</button>
        <button type="button" class="btn btn-ghost vol-range-btn" data-vol-range="week">Week</button>
        <button type="button" class="btn btn-ghost vol-range-btn" data-vol-range="custom">Custom…</button>
        <span id="vol-custom-range-inputs" class="hidden" style="display:inline-flex; gap:6px; align-items:center;">
          <input type="date" class="cell-input" id="vol-custom-start" style="width:auto;">
          <span class="subtext">to</span>
          <input type="date" class="cell-input" id="vol-custom-end" style="width:auto;">
          <button type="button" class="btn btn-ghost" id="vol-custom-apply">Apply</button>
        </span>
      </div>
      <div class="subtext" id="vol-range-display" style="margin-left:auto;"></div>
    </div>

    <div class="grid-scroll">
      <table class="board" id="vol-table"></table>
    </div>
    <div id="vol-empty-state" class="board-empty hidden">No data in this range yet.</div>
  </div>

  <!-- ================= Range picker modal (Period / Month / Week) ================= -->
  <div class="overlay hidden" id="modal-vol-range-picker">
    <div class="modal">
      <div class="modal-header">
        <h3 id="vrp-title">Select</h3>
        <button class="modal-close" id="vrp-close">&times;</button>
      </div>
      <div class="modal-body" id="vrp-body"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="vrp-cancel">Cancel</button>
        <button class="btn" id="vrp-apply">Apply</button>
      </div>
    </div>
  </div>

<script src="supabase.min.js"></script>
  <script src="analytics-data-compat.js"></script>
  <script type="module" src="loadboard.js" defer></script>
  <script type="module" src="analytics-volume.js" defer></script>
</body>
</html>
