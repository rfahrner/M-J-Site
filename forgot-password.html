<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — DL Transport Dispatch</title>
<link rel="stylesheet" href="loadboard.css?v=20260925-stop-times">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--slate-100,#f1f5f9); }
  .login-card { background:#fff; border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,.08); padding:36px 32px; width:100%; max-width:360px; }
  .login-card h1 { font-size:19px; margin:0 0 4px; }
  .login-card .subtext { margin-bottom:22px; line-height:1.45; }
  .login-card .field { margin-bottom:16px; }
  .login-card label { display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
  .login-card input { width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid var(--slate-500,#cbd5e1); border-radius:6px; font-size:14px; }
  .login-card .btn { width:100%; margin-top:6px; padding:10px; }
  .auth-message { color:#475569; font-size:13px; margin-top:12px; min-height:36px; line-height:1.45; }
  .auth-message.error { color:#b91c1c; }
  .auth-message.success { color:#166534; }
  .security-link { display:block; text-align:center; margin-top:14px; font-size:13px; color:#475569; }
</style>
</head>
<body>
  <main class="login-card">
    <h1>Reset your password</h1>
    <div class="subtext">Enter your username or email address and we’ll send a password-reset link if the account exists.</div>

    <form id="recovery-form">
      <div class="field">
        <label for="recovery-identity">Username or email</label>
        <input type="text" id="recovery-identity" autocomplete="username" required>
      </div>
      <button type="submit" class="btn" id="recovery-submit">Send reset link</button>
      <div id="recovery-message" class="auth-message" role="status" aria-live="polite"></div>
    </form>

    <a class="security-link" href="login.html">Back to sign in</a>
  </main>

  <script src="supabase.min.js"></script>
  <script>
    const SUPABASE_URL = "https://ygsapysqzwrpcimgvaqx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_8b8bSIiYm5TzLTw0WG1pAw_5ZWW5ZPL";
    const USERNAME_DOMAIN = "dltransport.local";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession:true, autoRefreshToken:true, storageKey:"dl-dispatch-auth" },
    });

    const form = document.getElementById("recovery-form");
    const identityInput = document.getElementById("recovery-identity");
    const submitButton = document.getElementById("recovery-submit");
    const message = document.getElementById("recovery-message");

    function setMessage(text, type="") {
      message.textContent = text || "";
      message.className = `auth-message${type ? ` ${type}` : ""}`;
    }

    function normalizeIdentity(value) {
      const identity = value.trim();
      return identity.includes("@") ? identity : `${identity}@${USERNAME_DOMAIN}`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const identity = identityInput.value.trim();
      if (!identity) return;

      submitButton.disabled = true;
      submitButton.textContent = "Sending…";
      setMessage("");

      const redirectTo = new URL("reset-password.html", window.location.href).href;
      const { error } = await supabaseClient.auth.resetPasswordForEmail(normalizeIdentity(identity), { redirectTo });

      submitButton.disabled = false;
      submitButton.textContent = "Send reset link";

      if (error) {
        console.error("Password recovery request failed:", error);
        const rateLimited = /rate limit|too many|email.*limit/i.test(error.message || "");
        setMessage(
          rateLimited
            ? "Password-reset email sending is temporarily limited. Please try again later."
            : "We could not send the reset email right now. Please try again later.",
          "error",
        );
        return;
      }

      setMessage("If an account matches that information, a password-reset link is on the way.", "success");
    });
  </script>
</body>
</html>
