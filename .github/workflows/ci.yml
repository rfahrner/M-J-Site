name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate lockfile security fix
        run: npm audit fix --package-lock-only

      - name: Reinstall fixed dependency tree
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build site
        run: npm run build

      - name: Upload fixed lockfile
        uses: actions/upload-artifact@v7
        with:
          name: fixed-package-lock
          path: package-lock.json
          if-no-files-found: error
