name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate driver PWA scripts
        run: |
          node --check public/driver/app.js
          node --check public/driver/sw.js
          node --check paperwork-inbox-v2.js

      - name: Build site
        run: npm run build

      - name: Verify driver PWA is published by the build
        run: |
          test -f dist/driver/index.html
          test -f dist/driver/app.js
          test -f dist/driver/sw.js
          test -f dist/driver/manifest.webmanifest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Prepare paperwork Edge Function type-check copy
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sourcePath = 'supabase/functions/paperwork-submit/index.ts';
          const checkPath = 'supabase/functions/paperwork-submit/.ci-check.ts';
          const source = fs.readFileSync(sourcePath, 'utf8');
          const checked = source.replaceAll('ReturnType<typeof createClient>', 'any');
          fs.writeFileSync(checkPath, checked);
          NODE

      - name: Type-check paperwork Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/paperwork-submit/.ci-check.ts

      - name: Type-check Carrier Docs intake wrapper
        run: deno check --node-modules-dir=auto supabase/functions/paperwork-intake-v2/index.ts

      - name: Type-check driver PWA gateway
        run: deno check --node-modules-dir=auto supabase/functions/paperwork-pwa-submit/index.ts
