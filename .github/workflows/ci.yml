name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate driver PWA scripts
        run: |
          node --check public/driver/app.js
          node --check public/driver/sw.js
          node --input-type=module --check < paperwork-inbox-v2.js
          node --input-type=module --check < paperwork-nav-full.js
          node --check driverlist-deeplink.js
          node --input-type=module --check < preshift-pro-text.js
          node --input-type=module --check < boardrates.js
          node --input-type=module --check < daily-rate-hierarchy.js
          node --input-type=module --check < daily-rate-modal-sync.js
          node --input-type=module --check < loadboard-toolbar-controls.js
          node --input-type=module --check < archive-image-backup.js
          node --input-type=module --check < long-task-guard.js
          node --input-type=module --check < archive-page.js
          node --input-type=module --check < archive-purge.js
          node --input-type=module --check < idle-session.js
          node --input-type=module --check < site-version-watch.js
          node --input-type=module --check < accounting-load-search.js
          node --input-type=module --check < houston.js
          node --input-type=module --check < mondelez.js

      - name: Test Delaware driver rates
        run: node scripts/delaware-driver-rates.test.mjs

      - name: Test cancellation labels and load notes
        run: node --test scripts/cancellation-load-notes.test.mjs

      - name: Test driver note ordering and presentation
        run: node --test scripts/driver-profile-notes.test.mjs

      - name: Test Archive dashboard observer
        run: node --test scripts/archive-capacity-observer.test.mjs

      - name: Test Available list notes and carrier rates
        run: node --test scripts/available-notes.test.mjs

      - name: Build site
        run: npm run build

      - name: Test Atlanta Night Shift
        run: node --test scripts/night-shift.test.mjs

      - name: Test group Outlook session fallback
        run: node --test scripts/group-outlook-session.test.mjs

      - name: Test accounting checkbox persistence
        run: node --test scripts/accounting-save.test.mjs scripts/accounting-note-icon.test.mjs

      - name: Test Atlanta and Delaware rounded-down mileage tiers
        run: node --test scripts/carrier-mileage-tiers.test.mjs

      - name: Test board row height stability
        run: node scripts/board-row-height-stability.test.mjs

      - name: Test overnight alert timing
        run: node --test scripts/overnight-alerts.test.mjs

      - name: Test alerts skip settled loads
        run: node scripts/alerts-skip-settled-loads.test.mjs

      - name: Test archive documents and Outlook fallback
        run: node --test scripts/archive-documents.test.mjs scripts/text-outlook-fallback.test.mjs

      - name: Verify driver PWA is published by the build
        run: |
          test -f dist/driver/index.html
          test -f dist/driver/app.js
          test -f dist/driver/sw.js
          test -f dist/driver/manifest.webmanifest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Prepare paperwork Edge Function type-check copy
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sourcePath = 'supabase/functions/paperwork-submit/index.ts';
          const checkPath = 'supabase/functions/paperwork-submit/.ci-check.ts';
          const source = fs.readFileSync(sourcePath, 'utf8');
          const checked = source.replaceAll('ReturnType<typeof createClient>', 'any');
          fs.writeFileSync(checkPath, checked);
          NODE

      - name: Type-check paperwork Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/paperwork-submit/.ci-check.ts

      - name: Type-check Carrier Docs intake wrapper
        run: deno check --node-modules-dir=auto supabase/functions/paperwork-intake-v2/index.ts

      - name: Type-check driver PWA gateway
        run: deno check --node-modules-dir=auto supabase/functions/paperwork-pwa-submit/index.ts

      - name: Prepare OneDrive archive Edge Function type-check copy
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sourcePath = 'supabase/functions/image-archive-onedrive/index.ts';
          const checkPath = 'supabase/functions/image-archive-onedrive/.ci-check.ts';
          const source = fs.readFileSync(sourcePath, 'utf8');
          const checked = source.replaceAll('ReturnType<typeof createClient>', 'any');
          fs.writeFileSync(checkPath, checked);
          NODE

      - name: Type-check OneDrive image archive
        run: deno check --node-modules-dir=auto supabase/functions/image-archive-onedrive/.ci-check.ts
