name: One-time private storage patch

on:
  push:
    branches: ["security/private-storage"]
    paths:
      - ".github/workflows/storage-hardening-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/private-storage
      - name: Patch trip-sheet URLs for private Storage
        shell: python
        run: |
          from pathlib import Path

          path = Path("loadboard.js")
          text = path.read_text()

          old_load = '''      loadDetailsState.attachments = attachments || [];
      loadDetailsState.history = (history || []).sort((a, b) => (a.changed_at < b.changed_at ? 1 : -1));'''
          new_load = '''      const attachmentRows = (attachments || []).map((a) => ({ ...a }));
      if (attachmentRows.length) {
        const paths = attachmentRows.map((a) => a.file_path);
        const { data: signedList, error: signErr } = await supabaseClient.storage.from("trip-sheets").createSignedUrls(paths, 3600);
        if (signErr) console.error("Failed to sign trip-sheet image URLs:", signErr);
        (signedList || []).forEach((entry, i) => {
          if (attachmentRows[i]) attachmentRows[i].publicUrl = (entry && entry.signedUrl) || "";
        });
      }
      loadDetailsState.attachments = attachmentRows;
      loadDetailsState.history = (history || []).sort((a, b) => (a.changed_at < b.changed_at ? 1 : -1));'''

          old_upload = '''        const { data: urlData } = supabaseClient.storage.from("trip-sheets").getPublicUrl(path);
        const { data: inserted, error: insErr } = await supabaseClient.from("load_attachments")
          .insert({ shift_id: row.dbId, file_path: path, file_name: file.name }).select();
        if (insErr) throw insErr;
        loadDetailsState.attachments.push({ ...inserted[0], publicUrl: urlData.publicUrl });'''
          new_upload = '''        const { data: signed, error: signErr } = await supabaseClient.storage.from("trip-sheets").createSignedUrl(path, 3600);
        if (signErr) throw signErr;
        const { data: inserted, error: insErr } = await supabaseClient.from("load_attachments")
          .insert({ shift_id: row.dbId, file_path: path, file_name: file.name }).select();
        if (insErr) throw insErr;
        loadDetailsState.attachments.push({ ...inserted[0], publicUrl: signed.signedUrl });'''

          if old_load not in text:
              raise SystemExit("Expected attachment-load snippet not found")
          if old_upload not in text:
              raise SystemExit("Expected upload snippet not found")

          text = text.replace(old_load, new_load, 1)
          text = text.replace(old_upload, new_upload, 1)
          path.write_text(text)
      - name: Remove one-time workflow and commit patch
        run: |
          rm .github/workflows/storage-hardening-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- loadboard.js .github/workflows/storage-hardening-patch.yml
          git commit -m "Use signed URLs for private trip sheets"
          git push origin HEAD:security/private-storage
